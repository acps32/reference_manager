<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/api.js"></script>
    <script defer src="js/canvas.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <input type="file" id="upload-input" hidden>
    <canvas id="canvas"></canvas>

    <div id="pie-menu" class="pie-menu hidden">
        <div class="pie-center"></div>
        <button class="pie-item" data-action="upload">Import image</button>
        <button class="pie-item" data-action="text">Add text</button>
        <button class="pie-item" data-action="delete">Delete</button>
    </div>

    <button id="settings-button" class="icon-button" title="Advanced settings (N)">⋮</button>
    <div id="settings-panel" class="settings-panel hidden">
        <label class="settings-option">
            <input type="checkbox" id="snap-toggle">
            Snap
        </label>
        <div class="settings-option scale-control">
            <span>Scale</span>
            <button id="scale-down" class="scale-button">&minus;</button>
            <button id="scale-up" class="scale-button">+</button>
        </div>
    </div>
</body>
</html>
